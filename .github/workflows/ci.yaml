name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
        app: [extractor, transcriber, dashboard]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          if [ -f ${{ matrix.app }}/requirements.txt ]; then pip install -r ${{ matrix.app }}/requirements.txt; fi

      - name: Run Ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      matrix:
        python-version: ["3.14"]
        app: [extractor, transcriber]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          if [ -f ${{ matrix.app }}/requirements.txt ]; then pip install -r ${{ matrix.app }}/requirements.txt; fi

      - name: Run tests
        run: pytest ${{ matrix.app }}/tests --tb=short -p no:cacheprovider --cov=${{ matrix.app }} --cov-fail-under=70
