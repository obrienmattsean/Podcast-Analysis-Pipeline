name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          if [ -f pipeline/requirements.txt ]; then pip install -r pipeline/requirements.txt; fi

      - name: Run Ruff
        run: ruff check .

  typecheck:
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          if [ -f pipeline/requirements.txt ]; then pip install -r pipeline/requirements.txt; fi
          if [ -f extractor/requirements.txt ]; then pip install -r extractor/requirements.txt; fi

      - name: Run ty
        run: ty check .

  test:
    runs-on: ubuntu-latest
    needs: [typecheck]
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          if [ -f pipeline/requirements.txt ]; then pip install -r pipeline/requirements.txt; fi
          if [ -f extractor/requirements.txt ]; then pip install -r extractor/requirements.txt; fi

      - name: Run tests
        run: pytest --tb=short -p no:cacheprovider --cov --cov-fail-under=70
