name: Ruff

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "**/requirements.txt"
      - ".github/workflows/**"
  pull_request:
    branches: [main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    needs: test

    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install ruff
          for reqfile in $(find . -name "requirements.txt" -type f); do
            pip install -r "$reqfile"
          done

      - name: Run Ruff
        run: |
          ruff check .